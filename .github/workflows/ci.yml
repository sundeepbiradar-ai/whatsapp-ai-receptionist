name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Build for production
        run: npm run build

  integration:
    name: Integration and RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Apply migrations from scratch
        run: supabase start && supabase db reset --local

      - name: Run integration and RLS tests
        run: |
          export SUPABASE_TEST_URL="$(supabase status -o json | jq -r .API_URL)"
          export SUPABASE_TEST_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)"
          npm run test:integration
